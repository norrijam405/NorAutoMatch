name: NorAutoMatch Manager Transport CI

on:
  push:
    branches:
      - "reactivation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  manager-transport:
    name: manager-transport-repeat-${{ matrix.repeat }}
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile verification surface
        run: |
          rm -rf .tmp-inventory-tests
          npx tsc -p tsconfig.inventory-tests.json

      - name: Verify fail-closed manager session boundary
        run: node .tmp-inventory-tests/scripts/manager-session-auth.behavior.js

      - name: Typecheck authenticated manager routes
        run: npm run typecheck

      - name: Lint authenticated manager routes
        run: npm run lint

      - name: Production build authenticated manager routes
        run: npm run build
