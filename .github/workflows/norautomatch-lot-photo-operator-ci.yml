name: NorAutoMatch Lot Photo Operator CI

on:
  push:
    branches:
      - feature/2026-09-16-lot-photo-operator-v1-1
    paths:
      - "src/app/manager/photos/**"
      - "src/app/manager/page.tsx"
      - "src/lib/supabase/database.types.ts"
      - "supabase/schema/vehicle_lot_photo_*.sql"
      - ".github/workflows/norautomatch-lot-photo-operator-ci.yml"
  pull_request:
    paths:
      - "src/app/manager/photos/**"
      - "src/app/manager/page.tsx"
      - "src/lib/supabase/database.types.ts"
      - "supabase/schema/vehicle_lot_photo_*.sql"
      - ".github/workflows/norautomatch-lot-photo-operator-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
