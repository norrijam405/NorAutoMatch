name: NorAutoMatch R2 FRC-45 FRC-47 Builder CI
on:
  push:
    branches: ["remediation/r2-frc45-frc47-assignment-upstream-anchor"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          for db in norauto_preseed norauto_normal; do
            sudo -u postgres dropdb --if-exists "$db"
            sudo -u postgres createdb -O norauto "$db"
            PGPASSWORD=norauto-ci-password psql -h 127.0.0.1 -U norauto -d "$db" -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          done
      - name: FRC-45 old upstream-existence migration preseed remains protected by r3 anchor
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_preseed
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-ownership-upstream-existence-r2.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc4547-builder-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc4547-preseed
          PGPASSWORD: norauto-ci-password
        run: |
          node scripts/frc28-preseed-v16.mjs
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_preseed -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc4547-builder-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('frc45','NORAUTO_SITE_CHAT','nonexistent','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL
          then
            echo "ERROR: FRC-45 preseed suppressed upstream truth"
            exit 1
          fi
      - name: FRC-47 auth-only assignment guard cannot remove upstream truth
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_normal
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc4547-normal-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc4547-normal
          PGPASSWORD: norauto-ci-password
        run: |
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_normal -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc4547-normal-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('frc47','NORAUTO_SITE_CHAT','nonexistent','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL
          then
            echo "ERROR: auth-only main guard bypassed stable upstream anchor"
            exit 1
          fi
          npx tsc -p tsconfig.conversation-ownership.json
          node .tmp-conversation-ownership/scripts/conversation-ownership.integration.js
      - name: Exact r3 anchor preseed fails closed
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_preseed
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-ownership-upstream-anchor-r3.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc4547-anchor-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc4547-anchor-preseed
        run: |
          sudo -u postgres dropdb --if-exists norauto_anchorpre
          sudo -u postgres createdb -O norauto norauto_anchorpre
          PGPASSWORD=norauto-ci-password psql -h 127.0.0.1 -U norauto -d norauto_anchorpre -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          export NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_anchorpre
          node scripts/frc28-preseed-v16.mjs
          set +e
          output="$(npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-conversation-ownership-upstream-anchor-r3.sql"
      - run: npm run typecheck
      - run: npm run build
