name: NorAutoMatch Reactivation CI

on:
  push:
    branches:
      - "reactivation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify-repeat-${{ matrix.repeat }}
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Inventory, desk-prep, manager-handoff, and manager-receipt verification suite
        run: |
          rm -rf .tmp-inventory-tests
          npx tsc -p tsconfig.inventory-tests.json
          node .tmp-inventory-tests/scripts/live-inventory.behavior.js
          node .tmp-inventory-tests/scripts/orr-parser.behavior.js
          node .tmp-inventory-tests/scripts/inventory-bridge.behavior.js
          node .tmp-inventory-tests/scripts/inventory-runtime.behavior.js
          node .tmp-inventory-tests/scripts/orr-algolia-sync.behavior.js
          node .tmp-inventory-tests/scripts/orr-customer-catalog.behavior.js
          node .tmp-inventory-tests/scripts/inventory-catalog-integrity.behavior.js
          node .tmp-inventory-tests/scripts/lead-inventory-evidence.behavior.js
          node .tmp-inventory-tests/scripts/desk-prep.behavior.js
          node .tmp-inventory-tests/scripts/manager-handoff.behavior.js
          node .tmp-inventory-tests/scripts/manager-review-receipt.behavior.js
          rm -rf .tmp-inventory-tests

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
