name: NorAutoMatch Render Production Proof

on:
  push:
    branches:
      - "validation/2026-09-10-render-public-proof"

permissions:
  contents: read

# This validation branch is intentionally separate from the deploy branch.
# A push here reruns the hosted proof after the expected deployed release identity is bound.
jobs:
  prove-render-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://norautomatch.onrender.com
      EXPECTED_RELEASE_SHA: 5fe083a6af945867cc79fbe14739aa9543d457fc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact public deployment read-only boundary
        run: node scripts/verify-public-deployment.mjs "$BASE_URL" "$EXPECTED_RELEASE_SHA"

      - name: Submit unmistakably synthetic production lead
        shell: bash
        run: |
          set -euo pipefail
          payload='{"firstName":"Synthetic","lastName":"LaunchProof","email":"synthetic-launch-proof@invalid.example","phone":"4055550199","budgetRange":"$400-$500","paymentMethod":"Financing","tradeIn":"","notes":"SYNTHETIC_PRODUCTION_VALIDATION — NOT A REAL CUSTOMER OR CONVERSION. Preserve only as deployment evidence.","source":"SYNTHETIC_PRODUCTION_VALIDATION","trigger":"retail","pipeline":"Standard Retail","shortlistedVehicleIds":[],"monthlyTarget":450,"downPayment":2000,"termMonths":72,"consent":true}'
          response_file="$(mktemp)"
          status="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$BASE_URL/api/leads")"
          cat "$response_file"
          test "$status" = "202"
          jq -e '.accepted == true and (.opportunityId | type == "string" and length > 0) and (.handoffId | type == "string" and length > 0) and (.persistence == "COMMITTED" or .persistence == "DEDUPLICATED") and .delivery == "QUEUED"' "$response_file" >/dev/null
          echo 'PASS_SYNTHETIC_LEAD_PERSISTENCE_PROOF'
          jq -r '"PERSISTENCE=" + .persistence, "OPPORTUNITY_ID=" + .opportunityId, "HANDOFF_ID=" + .handoffId' "$response_file"

      - name: Emit production proof receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-receipt
          jq -n \
            --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg publicOrigin "$BASE_URL" \
            --arg expectedReleaseSha "$EXPECTED_RELEASE_SHA" \
            '{receiptType:"NORAUTOMATCH_RENDER_PRODUCTION_PROOF",observedAt:$observedAt,publicOrigin:$publicOrigin,expectedReleaseSha:$expectedReleaseSha,inventoryPosture:"REPRESENTATIVE_DEMO_ONLY",customerVisibleLiveInventory:false,syntheticLeadOnly:true,proves:["public HTTPS service reachable","exact serving release identity matches expected SHA","public disclosure and internal-route boundaries pass reusable verifier","one unmistakably synthetic lead received HTTP 202 after durable CRM persistence returned COMMITTED or DEDUPLICATED"],doesNotProve:["live Orr inventory activation","external CRM webhook delivery","real customer conversion","SOLD or LOST outcome","Windows user-live validation","independent Beta assurance"],authorityEffect:"NONE"}' > validation-receipt/render-production-proof.json
          sha256sum validation-receipt/render-production-proof.json | sed 's#validation-receipt/##' > validation-receipt/render-production-proof.sha256
          cat validation-receipt/render-production-proof.json
          cat validation-receipt/render-production-proof.sha256

      - name: Upload production proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: norautomatch-render-production-proof
          path: validation-receipt/render-production-proof*
          if-no-files-found: error
          retention-days: 30
