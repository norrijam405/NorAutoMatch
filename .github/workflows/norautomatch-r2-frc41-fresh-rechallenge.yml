name: NorAutoMatch R2 FRC-41 Fresh Rechallenge
on:
  push:
    branches: ["evidence/r2-frc41-fresh-rechallenge-20261010"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rechallenge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify frozen Builder successor
        run: |
          test "$(git rev-parse 4471868a64130583ea5b0717bbe0bdfb56ebf675^{tree})" = "b57a08e87b39cc7a9afeadec8c91824bab821c40"
      - run: npm ci
      - name: Start PostgreSQL and bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc41-rechallenge-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc41-rechallenge
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_ci
          sudo -u postgres createdb -O norauto norauto_ci
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
      - name: Fresh cross-workspace upstream substitution attack
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.crm_conversation_events
            (workspace_id,provider,event_id,conversation_id,event_type,observed_at,normalized_payload,routing_decision,routing_reasons,processing_state)
          values
            ('other-workspace','NORAUTO_SITE_CHAT','frc41-cross-event','shared-conversation',
             'CONVERSATION_ENDED_OR_HANDOFF_READY',clock_timestamp(),'{}'::jsonb,'CONTACTABLE','[]'::jsonb,'RECEIVED');
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc41-rechallenge-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('target-workspace','NORAUTO_SITE_CHAT','shared-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL
          then
            echo "ERROR: cross-workspace upstream event substituted for target conversation"
            exit 1
          fi
          echo "PASS FRC-41 fresh cross-workspace substitution rejected"
      - name: Legitimate ownership regression
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc41-rechallenge-0123456789abcdef
        run: |
          npx tsc -p tsconfig.conversation-ownership.json
          node .tmp-conversation-ownership/scripts/conversation-ownership.integration.js
      - run: npm run typecheck
