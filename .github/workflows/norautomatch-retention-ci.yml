name: NorAutoMatch Customer Retention CI

on:
  push:
    branches:
      - "candidate/**"
      - "reactivation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  retention-truth-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile retention verification surface
        run: |
          rm -rf .tmp-retention-tests
          npx tsc -p tsconfig.retention-tests.json

      - name: Challenge retention truth, consent, suppression, and authority boundaries
        run: node .tmp-retention-tests/scripts/customer-retention.behavior.js

      - name: Clean generated verification output
        run: rm -rf .tmp-retention-tests

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
