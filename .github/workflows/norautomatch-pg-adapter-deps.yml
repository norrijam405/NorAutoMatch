name: NorAutoMatch PG Adapter Dependency Install

on:
  push:
    branches:
      - "reactivation/2026-09-08-crm-pg-adapter"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout adapter branch
        uses: actions/checkout@v4
        with:
          ref: reactivation/2026-09-08-crm-pg-adapter

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install bounded Postgres adapter dependencies
        run: |
          npm install --save-exact pg@8
          npm install --save-dev --save-exact @types/pg@8

      - name: Require zero high or critical findings
        run: npm audit --audit-level=high

      - name: Prove dependency tree
        run: npm ls pg @types/pg --depth=0

      - name: Commit exact manifest and lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add exact Postgres adapter dependencies"
          git push origin HEAD:reactivation/2026-09-08-crm-pg-adapter
