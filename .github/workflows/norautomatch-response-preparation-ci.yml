name: NorAutoMatch Response Preparation CI

on:
  push:
    branches:
      - "reactivation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  response-preparation-truth-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile verification surface
        run: |
          rm -rf .tmp-inventory-tests
          npx tsc -p tsconfig.inventory-tests.json

      - name: Challenge response preparation packet truth boundary
        run: node .tmp-inventory-tests/scripts/conversation-response-preparation.behavior.js

      - name: Challenge response draft truth boundary
        run: node .tmp-inventory-tests/scripts/conversation-response-draft.behavior.js

      - name: Clean generated verification output
        run: rm -rf .tmp-inventory-tests

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
