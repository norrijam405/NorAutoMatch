name: NorAutoMatch Torque Video Recommendations CI

on:
  push:
    branches:
      - "feature/2026-10-05-torque-video-recommendations-r0"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  torque-video-recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Compile recommendation verification surface
        run: |
          rm -rf .tmp-torque-video-recommendations
          npx tsc -p tsconfig.torque-video-recommendations.json
      - name: Challenge VIN recommendation boundary
        run: node .tmp-torque-video-recommendations/scripts/torque-video-recommendations.behavior.js
      - name: Clean generated verification output
        run: rm -rf .tmp-torque-video-recommendations
      - name: Typecheck application
        run: npm run typecheck
      - name: Production build
        run: npm run build
