name: NorAutoMatch R2 BRC-FRC-22 Binding Secret Rotation CI

on:
  push:
    branches:
      - "remediation/r2-frc22-customer-binding-secret-rotation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frc22-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_frc22
          sudo -u postgres createdb -O norauto norauto_frc22

      - name: Prepare CRM prerequisite
        env:
          PGPASSWORD: norauto-ci-password
        run: psql -h 127.0.0.1 -U norauto -d norauto_frc22 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql

      - name: Bootstrap original key
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc22
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc22-old
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc22-old-governed-secret-0123456789abcdef
        run: |
          npm start
          node scripts/verify-production-v15.mjs
          node scripts/customer-opportunity-binding.frc16.integration.mjs

      - name: First governed rotation
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc22
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc22-new
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc22-new-governed-secret-abcdef0123456789
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: ci-frc22-old-governed-secret-0123456789abcdef
        run: |
          npm start
          node scripts/verify-production-v15.mjs
          NORAUTO_FRC22_SUFFIX=a node scripts/frc22-binding-rotation.integration.mjs

      - name: Second governed rotation
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc22
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc22-newer
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc22-newer-governed-secret-9876543210abcdef
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: ci-frc22-new-governed-secret-abcdef0123456789
        run: |
          npm start
          node scripts/verify-production-v15.mjs
          NORAUTO_FRC22_SUFFIX=b node scripts/frc22-binding-rotation.integration.mjs

      - name: Broad communication and site-chat regressions
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc22
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc22-newer-governed-secret-9876543210abcdef
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: ci-frc22-new-governed-secret-abcdef0123456789
        run: |
          npx tsc -p tsconfig.communication-ledger.json
          node .tmp-communication-ledger/scripts/conversation-communication-ledger.integration.js
          npx tsc -p tsconfig.site-chat-thread.json
          node .tmp-site-chat-thread/scripts/site-chat-thread.integration.js

      - run: npm run typecheck
      - run: npm run build
