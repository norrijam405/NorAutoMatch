name: NorAutoMatch Customer Deal Prep Center CI

on:
  push:
    branches:
      - "feature/2026-10-05-customer-deal-prep-center-r0"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  customer-deal-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Compile deal-prep verification surface
        run: |
          rm -rf .tmp-customer-deal-prep
          npx tsc -p tsconfig.customer-deal-prep.json
      - name: Challenge customer deal-prep truth boundary
        run: node .tmp-customer-deal-prep/scripts/customer-deal-prep.behavior.js
      - name: Clean generated verification output
        run: rm -rf .tmp-customer-deal-prep
      - name: Typecheck application
        run: npm run typecheck
      - name: Production build
        run: npm run build
