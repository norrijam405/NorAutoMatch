name: NorAutoMatch Secrets Key Lifecycle CI

on:
  push:
    branches:
      - "reactivation/**"
  pull_request:
    branches:
      - main
      - "reactivation/**"

permissions:
  contents: read

jobs:
  secrets-key-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile secrets verification surface
        run: |
          rm -rf .tmp-secrets-tests
          npx tsc -p tsconfig.secrets-tests.json

      - name: Challenge machine signing-key rollover
        run: node .tmp-secrets-tests/scripts/machine-service-auth.behavior.js

      - name: Challenge manager signing-key rollover
        run: node .tmp-secrets-tests/scripts/manager-session-auth.behavior.js

      - name: Challenge abuse HMAC rollover continuity
        run: node .tmp-secrets-tests/scripts/public-abuse-control.behavior.js

      - name: Challenge production secret configuration truth
        run: node .tmp-secrets-tests/scripts/production-readiness.behavior.js

      - name: Enforce server-only secret surface
        run: node .tmp-secrets-tests/scripts/secrets-key-surface.behavior.js

      - name: Source secret-lifecycle contract
        run: |
          grep -F 'NORAUTO_RELAY_ASSERTION_PREVIOUS_SECRET' src/app/api/internal/crm-relay/route.ts
          grep -F 'NORAUTO_CONVERSATION_GATEWAY_ASSERTION_PREVIOUS_SECRET' src/app/api/internal/conversation-events/route.ts
          grep -F 'NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET' src/app/api/leads/route.ts
          grep -F 'configuredPreviousSecret' src/lib/machine-service-auth.ts
          grep -F 'previousHmacSecret' src/lib/public-abuse-control.ts
          grep -F 'PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET' src/lib/production-readiness.ts
          if grep -F 'NORAUTO_RELAY_TRIGGER_TOKEN' src/app/api/internal/crm-relay/route.ts; then
            echo 'Relay route regressed to retired static bearer token.' >&2
            exit 1
          fi
          if grep -F 'NORAUTO_CONVERSATION_GATEWAY_TOKEN' src/app/api/internal/conversation-events/route.ts; then
            echo 'Conversation route regressed to retired static bearer token.' >&2
            exit 1
          fi

      - name: Clean generated verification output
        run: rm -rf .tmp-secrets-tests

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
