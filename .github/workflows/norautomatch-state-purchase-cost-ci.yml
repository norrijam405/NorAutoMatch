name: NorAutoMatch State Purchase Cost CI

on:
  push:
    branches:
      - "candidate/**"
      - "reactivation/**"
  pull_request:
    branches:
      - main
      - "reactivation/**"

permissions:
  contents: read

jobs:
  state-purchase-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile state purchase cost tests
        run: |
          rm -rf .tmp-state-purchase-cost
          npx tsc -p tsconfig.state-purchase-cost-tests.json

      - name: Run state purchase cost truth challenges
        run: node .tmp-state-purchase-cost/scripts/state-purchase-cost.behavior.js

      - name: Run state purchase cost evidence gate challenges
        run: node .tmp-state-purchase-cost/scripts/state-purchase-cost-evidence-gate.behavior.js

      - name: Clean test output
        run: rm -rf .tmp-state-purchase-cost

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
