name: NorAutoMatch R2 FRC-39 FRC-40 Builder CI
on:
  push:
    branches: ["remediation/r2-frc39-frc40-assignment-event-sequencing"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start PostgreSQL and bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc3940-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc3940-builder
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_ci
          sudo -u postgres createdb -O norauto norauto_ci
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
      - name: FRC-39 duplicate CLAIMED must fail
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc3940-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('frc39','NORAUTO_SITE_CHAT','frc39-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc39','NORAUTO_SITE_CHAT','frc39-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc3940-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc39','NORAUTO_SITE_CHAT','frc39-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          then
            echo "ERROR: duplicate CLAIMED evidence accepted"
            exit 1
          fi
      - name: FRC-40 wrong actor duplicate RELEASED must fail
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc3940-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('frc40','NORAUTO_SITE_CHAT','frc40-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc40','NORAUTO_SITE_CHAT','frc40-conversation','CLAIMED','rep-a','rep-a');
          update public.crm_conversation_assignments
             set assignee_subject_id=null,assignment_state='UNASSIGNED',assigned_at=null,updated_at=clock_timestamp()
           where workspace_id='frc40' and provider='NORAUTO_SITE_CHAT' and conversation_id='frc40-conversation';
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc40','NORAUTO_SITE_CHAT','frc40-conversation','RELEASED','rep-a',null);
          commit;
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc3940-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc40','NORAUTO_SITE_CHAT','frc40-conversation','RELEASED','rep-b',null);
          commit;
          SQL
          then
            echo "ERROR: wrong actor duplicate RELEASED evidence accepted"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run build
