name: NorAutoMatch R2 FRC-48 Builder CI
on:
  push:
    branches: ["remediation/r2-frc48-event-sequencing-anchor"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start PostgreSQL and bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc48-builder-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc48-builder
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_ci
          sudo -u postgres createdb -O norauto norauto_ci
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
      - name: Downgraded evolving guard cannot remove stable sequencing
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc48-builder-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc48-builder
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.norautomatch_enforce_assignment_event_insert_authenticity()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          begin
            perform 'norautomatch.conversation_assignment_hmac_secret public.norautomatch_conversation_assignment_secret_trusted CONVERSATION_ASSIGNMENT_EVENT_AUTHENTICITY_REQUIRED CONVERSATION_ASSIGNMENT_EVENT_CLAIM_TRUTH_INVALID CONVERSATION_ASSIGNMENT_EVENT_RELEASE_TRUTH_INVALID public.crm_conversation_assignments CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED current_state current_assignee';
            return new;
          end;
          $$;
          SQL
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.crm_conversation_events
            (workspace_id,provider,event_id,conversation_id,event_type,observed_at,normalized_payload,routing_decision,routing_reasons,processing_state)
          values ('frc48','NORAUTO_SITE_CHAT','frc48-event','frc48-conversation',
            'CONVERSATION_ENDED_OR_HANDOFF_READY',clock_timestamp(),'{}'::jsonb,'CONTACTABLE','[]'::jsonb,'RECEIVED');
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc48-builder-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('frc48','NORAUTO_SITE_CHAT','frc48-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc48','NORAUTO_SITE_CHAT','frc48-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc48-builder-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc48','NORAUTO_SITE_CHAT','frc48-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          then
            echo "ERROR: duplicate CLAIMED escaped stable sequencing anchor"
            exit 1
          fi
      - name: Exact r9 preseed fails closed
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-assignment-events-sequencing-anchor-r9.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc48-preseed-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc48-preseed
        run: |
          sudo -u postgres dropdb --if-exists norauto_preseed
          sudo -u postgres createdb -O norauto norauto_preseed
          PGPASSWORD=norauto-ci-password psql -h 127.0.0.1 -U norauto -d norauto_preseed -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          export NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_preseed
          node scripts/frc28-preseed-v16.mjs
          set +e
          output="$(npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-conversation-assignment-events-sequencing-anchor-r9.sql"
      - run: npm run typecheck
      - run: npm run build
