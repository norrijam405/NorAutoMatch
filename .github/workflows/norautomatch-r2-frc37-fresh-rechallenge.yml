name: NorAutoMatch R2 FRC-37 Fresh Rechallenge
on:
  push:
    branches: ["evidence/r2-frc37-fresh-rechallenge-20261010"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rechallenge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: |
          test "$(git rev-parse 97e2f65e4b0086c772a86ce78bf15e5ffa1e41d3^{tree})" = "6b7e8510d5059d2196f674db5936aa56f825e34c"
      - run: npm ci
      - name: Start PostgreSQL and bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc37-rechallenge-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc37-rechallenge
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_ci
          sudo -u postgres createdb -O norauto norauto_ci
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
      - name: Fresh state-mismatch attacks
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc37-rechallenge-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('frc37-fresh','NORAUTO_SITE_CHAT','frc37-fresh-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc37-rechallenge-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc37-fresh','NORAUTO_SITE_CHAT','frc37-fresh-conversation','CLAIMED','rep-b','rep-b');
          commit;
          SQL
          then
            echo "ERROR: mismatched CLAIMED evidence accepted"
            exit 1
          fi
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc37-rechallenge-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc37-fresh','NORAUTO_SITE_CHAT','frc37-fresh-conversation','RELEASED','rep-a',null);
          commit;
          SQL
          then
            echo "ERROR: RELEASED evidence accepted while assignment remains ASSIGNED"
            exit 1
          fi
          echo "PASS FRC-37 fresh state-mismatch attacks rejected"
      - name: Legitimate claim/release regression
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc37-rechallenge-0123456789abcdef
        run: |
          npx tsc -p tsconfig.conversation-ownership.json
          node .tmp-conversation-ownership/scripts/conversation-ownership.integration.js
      - run: npm run typecheck
