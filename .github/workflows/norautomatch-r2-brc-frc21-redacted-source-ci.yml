name: NorAutoMatch R2 BRC-FRC-21 Redacted Communication Source CI

on:
  push:
    branches:
      - "remediation/r2-frc21-redacted-communication-source"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frc21-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_frc21
          sudo -u postgres createdb -O norauto norauto_frc21
      - name: Bootstrap exact successor schema
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc21
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc21-builder
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc21-governed-secret-0123456789abcdef
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_frc21 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_frc21 -tAc "select migration_name from norautomatch_schema_migrations where migration_name='infrastructure/norautomatch-conversation-communication-ledger-redacted-source-r1.sql'" | grep -q redacted-source-r1
      - name: Historical communication and FRC-19 regressions
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc21
        run: |
          npx tsc -p tsconfig.communication-ledger.json
          node .tmp-communication-ledger/scripts/conversation-communication-ledger.integration.js
          node scripts/frc19-communication-relation-shadow.integration.mjs
          node scripts/frc19-persistent-schema-shadow.integration.mjs
      - name: Re-test FRC-21
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc21
        run: node scripts/frc21-redacted-communication-source.integration.mjs
      - run: npm run typecheck
      - run: npm run build
