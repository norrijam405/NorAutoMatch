name: NorAutoMatch R2 BRC-FRC-18 Binding Secret Rotation CI

on:
  push:
    branches:
      - "remediation/r2-frc18-customer-binding-secret-rotation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frc18-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_frc18
          sudo -u postgres createdb -O norauto norauto_frc18

      - name: Prepare CRM prerequisite
        env:
          PGPASSWORD: norauto-ci-password
        run: psql -h 127.0.0.1 -U norauto -d norauto_frc18 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql

      - name: Bootstrap under original governed secret
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc18
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc18-old
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc18-old-governed-secret-0123456789abcdef
        run: |
          npm start
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-frc18-old-governed-secret-0123456789abcdef           node scripts/verify-production-v15.mjs

      - name: Rotate to new governed secret
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc18
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc18-new
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc18-new-governed-secret-abcdef0123456789
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: ci-frc18-old-governed-secret-0123456789abcdef
        run: |
          npm start
          node scripts/verify-production-v15.mjs
          node scripts/customer-opportunity-binding.frc16.integration.mjs

      - name: Repeat rotation to prove lifecycle is not one-shot
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc18
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc18-newer
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc18-newer-governed-secret-9876543210abcdef
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: ci-frc18-new-governed-secret-abcdef0123456789
        run: |
          npm start
          node scripts/verify-production-v15.mjs
          node scripts/customer-opportunity-binding.frc16.integration.mjs

      - name: Wrong previous secret cannot rotate anchor
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc18
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc18-attacker
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: attacker-selected-rotation-secret-0123456789abcdef
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: attacker-wrong-previous-secret-0123456789abcdef
        run: |
          if npm start; then
            echo "ERROR: wrong previous secret rotated the binding anchor"
            exit 1
          fi
          echo "PASS FRC-18 wrong previous secret cannot rotate binding anchor"

      - run: npm run typecheck
      - run: npm run build
