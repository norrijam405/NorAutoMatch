name: NorAutoMatch R2 FRC-32 Fresh Rechallenge
on:
  push:
    branches: ["evidence/r2-frc32-fresh-rechallenge-20261010"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rechallenge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: |
          test "$(git rev-parse bb71452faddb0d2a56d1ea31b222b84e75cab6b3^{tree})" = "393e38a3861a18d2900934d1d3c42a1b2cd22183"
      - run: npm ci
      - name: Start PostgreSQL and bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc32-rechallenge
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc32-secret-0123456789abcdef
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_ci
          sudo -u postgres createdb -O norauto norauto_ci
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
      - name: Historical FRC-32 witness
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
        run: node scripts/frc32-assignment-event-authenticity.integration.mjs
      - name: Fresh forged RELEASED and fake-secret attacks
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','attacker-selected-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values
            ('frc32-fresh','NORAUTO_SITE_CHAT','nonexistent-conversation','RELEASED','attacker',null);
          commit;
          SQL
          then
            echo "ERROR: fake secret forged RELEASED evidence"
            exit 1
          fi
          echo "PASS FRC-32 fresh forged RELEASED/fake-secret attack rejected"
      - run: npm run typecheck
