name: R1 Lockfile Recovery Artifact

on:
  push:
    branches:
      - feature/2026-09-15-supabase-auth-r1
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/r1-lockfile-recovery-artifact.yml

permissions:
  contents: read

jobs:
  recover-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove clean install from generated lockfile
        run: npm ci --ignore-scripts
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: r1-recovered-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
