name: NorAutoMatch R2 FC-01 Fresh Re-Challenger Expiry Challenge

on:
  push:
    branches:
      - "evidence/2026-10-05-r2-fc01-fresh-rechallenge-expiry"

permissions:
  contents: read

jobs:
  fresh-rechallenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: norauto
          POSTGRES_PASSWORD: norauto-ci-password
          POSTGRES_DB: norauto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U norauto -d norauto_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout challenge branch
        uses: actions/checkout@v4
      - name: Verify candidate implementation remains exact
        run: |
          git diff --exit-code 936b9bbd81ac83afc9383cf3b74b806c2ecdcbf3 --             src/lib/site-chat-thread.ts             src/app/api/manager/conversations/site-reply/route.ts             src/lib/conversation-ownership.ts             infrastructure/norautomatch-conversation-ownership-r0.sql             infrastructure/norautomatch-site-chat-thread-r0.sql
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply bounded schemas
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f infrastructure/norautomatch-crm-v4-conversation-events.sql
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f infrastructure/norautomatch-conversation-ownership-r0.sql
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f infrastructure/norautomatch-site-chat-thread-r0.sql
      - name: Compile exact candidate verification surface
        run: |
          rm -rf .tmp-site-chat-thread
          npx tsc -p tsconfig.site-chat-thread.json
      - name: Execute Fresh Re-Challenger challenge
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
        run: node .tmp-site-chat-thread/scripts/site-chat-thread.integration.js
