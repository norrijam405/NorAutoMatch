name: NorAutoMatch R2 Five-Lane Destroyer Round 3

on:
  push:
    branches:
      - "evidence/r2-5lane-destroyer-round3-20261009"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round3:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact product plus challenge harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Verify frozen product ancestor
        run: |
          git merge-base --is-ancestor e7f4c5bfc64ec898e885b9b2cb31b461e5cfd1a7 HEAD
          test "$(git rev-parse e7f4c5bfc64ec898e885b9b2cb31b461e5cfd1a7^{tree})" = "195b81bc6459570e8409cade05ec51c4cc064f7f"

      - name: Start PostgreSQL and isolated databases
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          for db in norauto_r3d1 norauto_r3d2 norauto_r3d3 norauto_r3d4 norauto_r3d5; do
            sudo -u postgres dropdb --if-exists "$db"
            sudo -u postgres createdb -O norauto "$db"
          done

      - name: Prepare D1 Video Hub database
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_r3d1 -v ON_ERROR_STOP=1 -f scripts/video-hub-ci-prereqs.sql
          psql -h 127.0.0.1 -U norauto -d norauto_r3d1 -v ON_ERROR_STOP=1 -f supabase/schema/video_hub_library_r0.sql
          psql -h 127.0.0.1 -U norauto -d norauto_r3d1 -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users(id) values ('00000000-0000-4000-8000-000000000001');
          insert into public.app_memberships(user_id,app_id,active,role)
          values ('00000000-0000-4000-8000-000000000001','norautomatch',true,'founder');
          SQL

      - name: Bootstrap D2-D5 exact CRM candidate
        env:
          PGPASSWORD: norauto-ci-password
          OLD_SECRET: ci-round3-old-governed-secret-0123456789abcdef
        run: |
          set -euo pipefail
          for lane in d2 d3 d4 d5; do
            db="norauto_r3$lane"
            psql -h 127.0.0.1 -U norauto -d "$db" -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
            NORAUTO_CRM_DATABASE_URL="postgres://norauto:norauto-ci-password@127.0.0.1:5432/$db"             NORAUTO_MIGRATION_ONLY=1             NORAUTO_RELEASE_SHA="round3-$lane"             NORAUTO_PUBLIC_ABUSE_HMAC_SECRET="$OLD_SECRET"             npm start
          done

      - name: Compile historical surfaces
        run: |
          npx tsc -p tsconfig.video-hub-library.json
          npx tsc -p tsconfig.communication-ledger.json
          npx tsc -p tsconfig.site-chat-thread.json

      - name: Seed D3 communication historical truth
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d3
        run: node .tmp-communication-ledger/scripts/conversation-communication-ledger.integration.js

      - name: Seed D4 and D5 site-chat historical truth
        env:
          OLD_SECRET: ci-round3-old-governed-secret-0123456789abcdef
        run: |
          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d4           NORAUTO_PUBLIC_ABUSE_HMAC_SECRET="$OLD_SECRET"           node .tmp-site-chat-thread/scripts/site-chat-thread.integration.js

          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d5           NORAUTO_PUBLIC_ABUSE_HMAC_SECRET="$OLD_SECRET"           node .tmp-site-chat-thread/scripts/site-chat-thread.integration.js

      - name: Exercise D2 production restart under rotated secret
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d2
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round3-d2-rotated
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round3-rotated-governed-secret-abcdef0123456789
        run: npm start

      - name: Run five fresh lanes concurrently
        env:
          OLD_SECRET: ci-round3-old-governed-secret-0123456789abcdef
          ROTATED_SECRET: ci-round3-rotated-governed-secret-abcdef0123456789
        run: |
          set +e
          (
            NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d1             node scripts/round3-d1-video-evidence-type.mjs
          ) > d1.log 2>&1 & p1=$!

          (
            NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d2             NORAUTO_ROTATED_BINDING_SECRET="$ROTATED_SECRET"             node scripts/round3-d2-binding-secret-rotation.mjs
          ) > d2.log 2>&1 & p2=$!

          (
            NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d3             node scripts/round3-d3-communication-shadow.mjs
          ) > d3.log 2>&1 & p3=$!

          (
            NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d4             NORAUTO_PUBLIC_ABUSE_HMAC_SECRET="$OLD_SECRET"             node scripts/round3-d4-redacted-sitechat-source.mjs
          ) > d4.log 2>&1 & p4=$!

          (
            NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r3d5             NORAUTO_PUBLIC_ABUSE_HMAC_SECRET="$OLD_SECRET"             node scripts/round3-d5-access-upsert.mjs
          ) > d5.log 2>&1 & p5=$!

          s1=0; wait "$p1" || s1=$?
          s2=0; wait "$p2" || s2=$?
          s3=0; wait "$p3" || s3=$?
          s4=0; wait "$p4" || s4=$?
          s5=0; wait "$p5" || s5=$?

          for lane in d1 d2 d3 d4 d5; do
            echo "===== $lane ====="
            cat "$lane.log"
          done
          echo "LANE_STATUS D1=$s1 D2=$s2 D3=$s3 D4=$s4 D5=$s5"
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ] || [ "$s3" -ne 0 ] || [ "$s4" -ne 0 ] || [ "$s5" -ne 0 ]; then
            exit 1
          fi

      - name: Typecheck
        if: always()
        run: npm run typecheck
