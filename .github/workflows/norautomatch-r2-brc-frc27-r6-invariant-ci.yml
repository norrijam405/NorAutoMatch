name: NorAutoMatch R2 BRC-FRC-27 R6 Migration Invariant CI
on:
  push:
    branches:
      - "remediation/r2-frc27-r6-migration-invariant"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frc27:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_frc27
          sudo -u postgres createdb -O norauto norauto_frc27
      - name: Prepare and preseed r6
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc27
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_frc27 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          node scripts/frc27-preseed-r6.mjs
      - name: Startup must reject missing recorded r6 invariant
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc27
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc27-preseed
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc27-secret-0123456789abcdef
        run: |
          set +e
          output="$(npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-site-chat-publication-secret-rotation-r6.sql"
      - run: npm run typecheck
      - run: npm run build
