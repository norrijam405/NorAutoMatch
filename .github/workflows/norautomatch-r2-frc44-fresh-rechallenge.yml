name: NorAutoMatch R2 FRC-44 Fresh Rechallenge
on:
  push:
    branches: ["evidence/r2-frc44-fresh-rechallenge-20261010"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rechallenge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify frozen Builder successor
        run: |
          test "$(git rev-parse 85d77bf8999a203fe564c6ea0e6ec49c16149f34^{tree})" = "7bc530d440ddb19ecfcf25a3576ca1db1588b458"
      - run: npm ci
      - name: Start PostgreSQL and bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc44-rechallenge-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc44-rechallenge
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_ci
          sudo -u postgres createdb -O norauto norauto_ci
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
      - name: Historical probe-specific spoof remains contained
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc44-rechallenge-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc44-rechallenge
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.norautomatch_enforce_assignment_event_insert_authenticity()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          begin
            perform 'norautomatch.conversation_assignment_hmac_secret public.norautomatch_conversation_assignment_secret_trusted CONVERSATION_ASSIGNMENT_EVENT_AUTHENTICITY_REQUIRED CONVERSATION_ASSIGNMENT_EVENT_CLAIM_TRUTH_INVALID CONVERSATION_ASSIGNMENT_EVENT_RELEASE_TRUTH_INVALID public.crm_conversation_assignments CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED current_state current_assignee';
            if new.workspace_id='__migration_probe__'
               and new.conversation_id='__missing_conversation__'
               and new.actor_subject_id='__probe_actor__' then
              raise exception 'CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED';
            end if;
            return new;
          end;
          $$;
          SQL
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc44-rechallenge-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc44-history','NORAUTO_SITE_CHAT','missing-history','CLAIMED','attacker','attacker');
          commit;
          SQL
          then
            echo "ERROR: historical probe-specific spoof escaped stable anchor"
            exit 1
          fi
      - name: Fresh disabled-anchor-trigger attack
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc44-rechallenge-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc44-rechallenge
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1             -c "alter table public.crm_conversation_assignment_events disable trigger crm_conversation_assignment_events_security_anchor"
          set +e
          output="$(npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-conversation-assignment-events-security-anchor-r7.sql"
      - run: npm run typecheck
