name: NorAutoMatch Torque Independent Assurance CI

on:
  push:
    branches:
      - "candidate/**"
      - "reactivation/**"
  pull_request:
    branches:
      - main
      - "reactivation/**"

permissions:
  contents: read

jobs:
  torque-independent-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile independent Torque assurance surface
        run: |
          rm -rf .tmp-torque-independent-assurance
          npx tsc -p tsconfig.torque-independent-assurance.json

      - name: Execute independent Torque adversarial challenge
        run: node .tmp-torque-independent-assurance/scripts/torque-independent-assurance.behavior.js

      - name: Clean independent verification output
        run: rm -rf .tmp-torque-independent-assurance

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
