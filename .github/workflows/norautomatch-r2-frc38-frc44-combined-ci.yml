name: NorAutoMatch R2 FRC-38-44 Combined Verification

on:
  push:
    branches: ["integration/r2-frc38-frc44-combined-20261010"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify frozen integrated product
        run: |
          test "$(git rev-parse 0cb0c9049f7f60b0c84a4f472c48435fb1d2deda^{tree})" = "ad33af4f9911e0434abfa9457bdf033a5b9b6dfd"
          git merge-base --is-ancestor 0cb0c9049f7f60b0c84a4f472c48435fb1d2deda HEAD

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Start PostgreSQL and isolated databases
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          for db in norauto_r4pre norauto_security norauto_events norauto_owner norauto_broad; do
            sudo -u postgres dropdb --if-exists "$db"
            sudo -u postgres createdb -O norauto "$db"
            PGPASSWORD=norauto-ci-password psql -h 127.0.0.1 -U norauto -d "$db" -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          done

      - name: FRC-38 r4 exact preseed fails closed
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r4pre
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-assignment-events-state-binding-r4.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-r4-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: combined-r4
        run: |
          node scripts/frc28-preseed-v16.mjs
          set +e
          output="$(npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-conversation-assignment-events-state-binding-r4.sql"

      - name: FRC-42 FRC-44 stable security anchor
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_security
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-security-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: combined-security
        run: |
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_security -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.norautomatch_enforce_assignment_event_insert_authenticity()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          begin
            perform 'norautomatch.conversation_assignment_hmac_secret public.norautomatch_conversation_assignment_secret_trusted CONVERSATION_ASSIGNMENT_EVENT_AUTHENTICITY_REQUIRED CONVERSATION_ASSIGNMENT_EVENT_CLAIM_TRUTH_INVALID CONVERSATION_ASSIGNMENT_EVENT_RELEASE_TRUTH_INVALID public.crm_conversation_assignments CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED current_state current_assignee';
            if new.workspace_id='__migration_probe__'
               and new.conversation_id='__missing_conversation__'
               and new.actor_subject_id='__probe_actor__' then
              raise exception 'CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED';
            end if;
            return new;
          end;
          $$;
          SQL
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_security -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-combined-security-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('combined-orphan','NORAUTO_SITE_CHAT','missing','CLAIMED','attacker','attacker');
          commit;
          SQL
          then
            echo "ERROR: stable anchor failed to block orphan evidence"
            exit 1
          fi
          psql -h 127.0.0.1 -U norauto -d norauto_security -v ON_ERROR_STOP=1             -c "alter table public.crm_conversation_assignment_events disable trigger crm_conversation_assignment_events_security_anchor"
          set +e
          output="$(npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-conversation-assignment-events-security-anchor-r7.sql"

      - name: FRC-39 FRC-40 FRC-43 transition sequencing and concurrency
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_events
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-events-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: combined-events
        run: |
          npm start
          node scripts/frc43-concurrent-claim.integration.mjs

          psql -h 127.0.0.1 -U norauto -d norauto_events -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.crm_conversation_events
            (workspace_id,provider,event_id,conversation_id,event_type,observed_at,normalized_payload,routing_decision,routing_reasons,processing_state)
          values
            ('multi','NORAUTO_SITE_CHAT','multi-event','multi-conversation','CONVERSATION_ENDED_OR_HANDOFF_READY',
             clock_timestamp(),'{}'::jsonb,'CONTACTABLE','[]'::jsonb,'RECEIVED');
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-combined-events-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('multi','NORAUTO_SITE_CHAT','multi-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL

          if psql -h 127.0.0.1 -U norauto -d norauto_events -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-combined-events-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values
            ('multi','NORAUTO_SITE_CHAT','multi-conversation','CLAIMED','rep-a','rep-a'),
            ('multi','NORAUTO_SITE_CHAT','multi-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          then
            echo "ERROR: multi-row duplicate CLAIMED evidence accepted"
            exit 1
          fi

      - name: FRC-41 upstream conversation existence
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_owner
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-owner-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: combined-owner
        run: |
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_owner -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-combined-owner-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('owner','NORAUTO_SITE_CHAT','nonexistent','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL
          then
            echo "ERROR: nonexistent conversation assignment accepted"
            exit 1
          fi
          npx tsc -p tsconfig.conversation-ownership.json
          node .tmp-conversation-ownership/scripts/conversation-ownership.integration.js

      - name: Broad regression bootstrap
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_broad
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-broad-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: combined-broad
        run: npm start

      - name: Broad regressions
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_broad
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-broad-secret-0123456789abcdef
        run: |
          npx tsc -p tsconfig.secure-document-binding.json
          node .tmp-secure-document-binding/scripts/secure-document-opportunity-binding.integration.js
          npx tsc -p tsconfig.communication-ledger.json
          node .tmp-communication-ledger/scripts/conversation-communication-ledger.integration.js
          npx tsc -p tsconfig.site-chat-thread.json
          node .tmp-site-chat-thread/scripts/site-chat-thread.integration.js

      - run: npm run typecheck
      - run: npm run build
