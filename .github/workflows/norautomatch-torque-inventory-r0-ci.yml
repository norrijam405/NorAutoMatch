name: NorAutoMatch Torque Inventory R0 CI

on:
  push:
    branches:
      - "feature/2026-10-12-torque-inventory-matchdna-r0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  torque-inventory-r0:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: norautomatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d norautomatch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate (record existing blocker)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validate Watchtower migration on fresh Postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d norautomatch_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          SQL
          psql -h 127.0.0.1 -U postgres -d norautomatch_ci -v ON_ERROR_STOP=1 -f infrastructure/norautomatch-crm-v1.sql
          psql -h 127.0.0.1 -U postgres -d norautomatch_ci -v ON_ERROR_STOP=1 -f infrastructure/norautomatch-crm-v13-torque-hunts-scout-opportunities.sql
          psql -h 127.0.0.1 -U postgres -d norautomatch_ci -v ON_ERROR_STOP=1 -Atc "SELECT tablename || ':' || rowsecurity FROM pg_tables WHERE schemaname='public' AND tablename IN ('torque_vehicle_hunts','industry_scout_observations','scout_opportunity_matches') ORDER BY tablename;" | tee /tmp/watchtower-rls.txt
          grep -q '^industry_scout_observations:true
      - name: Execute Torque R0 behavior checks
        run: node .tmp-torque-inventory-r0/scripts/torque-inventory-r0.behavior.js

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
 /tmp/watchtower-rls.txt
          grep -q '^scout_opportunity_matches:true
      - name: Execute Torque R0 behavior checks
        run: node .tmp-torque-inventory-r0/scripts/torque-inventory-r0.behavior.js

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
 /tmp/watchtower-rls.txt
          grep -q '^torque_vehicle_hunts:true
      - name: Execute Torque R0 behavior checks
        run: node .tmp-torque-inventory-r0/scripts/torque-inventory-r0.behavior.js

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
 /tmp/watchtower-rls.txt

      - name: Compile Torque R0 behavior checks
        run: |
          rm -rf .tmp-torque-inventory-r0
          npx tsc -p tsconfig.torque-inventory-r0.json

      - name: Execute Torque R0 behavior checks
        run: node .tmp-torque-inventory-r0/scripts/torque-inventory-r0.behavior.js

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
