name: NorAutoMatch R2 FRC-23-27 Combined Verification

on:
  push:
    branches: ["integration/r2-frc23-frc27-combined-20261010"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify frozen integrated product candidate
        run: |
          test "$(git rev-parse 68183fad9b88d312d60f58b624ceb08a81910e05^{tree})" = "9031ee0400188eb949302b937a6ecaa7a6e12222"
          git merge-base --is-ancestor 68183fad9b88d312d60f58b624ceb08a81910e05 HEAD

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Start PostgreSQL and isolated databases
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          for db in norauto_frc23 norauto_frc24 norauto_frc25 norauto_frc26 norauto_frc27 norauto_broad; do
            sudo -u postgres dropdb --if-exists "$db"
            sudo -u postgres createdb -O norauto "$db"
          done

      - name: FRC-23 combined lane
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_frc23 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc23           NORAUTO_MIGRATION_ONLY=1           NORAUTO_RELEASE_SHA=combined-frc23-old           NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-combined-frc23-old-0123456789abcdef           npm start
          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc23           NORAUTO_MIGRATION_ONLY=1           NORAUTO_RELEASE_SHA=combined-frc23-new           NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-combined-frc23-new-abcdef0123456789           NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET=ci-combined-frc23-old-0123456789abcdef           npm start
          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc23           NORAUTO_PREVIOUS_SECRET=ci-combined-frc23-old-0123456789abcdef           node scripts/frc23-previous-binding-secret.integration.mjs

      - name: FRC-24 combined lane
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc24
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_frc24 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          node scripts/frc24-preseed-frc21-migration.mjs
          set +e
          output="$(NORAUTO_MIGRATION_ONLY=1 NORAUTO_RELEASE_SHA=combined-frc24 NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-combined-frc24-secret-0123456789abcdef npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-conversation-communication-ledger-redacted-source-r1.sql"

      - name: FRC-25 combined lane
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc25
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: combined-frc25
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-frc25-secret-0123456789abcdef
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_frc25 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
          node scripts/frc25-conversation-assignment-authority.integration.mjs

      - name: FRC-26 combined lane
        env:
          PGPASSWORD: norauto-ci-password
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_frc26 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc26           NORAUTO_MIGRATION_ONLY=1           NORAUTO_RELEASE_SHA=combined-frc26-old           NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-combined-frc26-old-0123456789abcdef           npm start
          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc26           NORAUTO_MIGRATION_ONLY=1           NORAUTO_RELEASE_SHA=combined-frc26-new           NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-combined-frc26-new-abcdef0123456789           NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET=ci-combined-frc26-old-0123456789abcdef           npm start
          NORAUTO_CRM_DATABASE_URL=postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc26           NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-combined-frc26-new-abcdef0123456789           NORAUTO_PREVIOUS_SECRET=ci-combined-frc26-old-0123456789abcdef           node scripts/frc26-previous-sitechat-secret.integration.mjs

      - name: FRC-27 combined lane
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc27
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_frc27 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          node scripts/frc27-preseed-r6.mjs
          set +e
          output="$(NORAUTO_MIGRATION_ONLY=1 NORAUTO_RELEASE_SHA=combined-frc27 NORAUTO_PUBLIC_ABUSE_HMAC_SECRET=ci-combined-frc27-secret-0123456789abcdef npm start 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep "MIGRATION_INVARIANT_MISSING:infrastructure/norautomatch-site-chat-publication-secret-rotation-r6.sql"

      - name: Broad regression bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_broad
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: combined-broad
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-broad-secret-0123456789abcdef
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_broad -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start

      - name: Broad regressions
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_broad
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-combined-broad-secret-0123456789abcdef
        run: |
          npx tsc -p tsconfig.secure-document-binding.json
          node .tmp-secure-document-binding/scripts/secure-document-opportunity-binding.integration.js
          npx tsc -p tsconfig.communication-ledger.json
          node .tmp-communication-ledger/scripts/conversation-communication-ledger.integration.js
          npx tsc -p tsconfig.site-chat-thread.json
          node .tmp-site-chat-thread/scripts/site-chat-thread.integration.js

      - run: npm run typecheck
      - run: npm run build
