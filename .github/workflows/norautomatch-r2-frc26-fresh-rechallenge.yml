name: NorAutoMatch R2 FRC-26 Fresh Rechallenge
on:
  push:
    branches: ["evidence/r2-frc26-fresh-rechallenge-20261010"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rechallenge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: norauto
          POSTGRES_PASSWORD: norauto-ci-password
          POSTGRES_DB: norauto_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U norauto -d norauto_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          test "$(git rev-parse 7d89c31f04ffbe621d8e79badd646ebc13ce8e09^{tree})" = "c5fe5beae652e0801d297848ddbdfe84ea17560a"
      - run: npm ci
      - name: Prepare
        env:
          PGPASSWORD: norauto-ci-password
        run: psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
      - name: Bootstrap old
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc26-rechallenge-old
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc26-old-secret-0123456789abcdef
        run: npm start
      - name: Rotate
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc26-rechallenge-new
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc26-new-secret-abcdef0123456789
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: ci-frc26-old-secret-0123456789abcdef
        run: npm start
      - name: Historical FRC-26 witness
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc26-new-secret-abcdef0123456789
          NORAUTO_PREVIOUS_SECRET: ci-frc26-old-secret-0123456789abcdef
        run: node scripts/frc26-previous-sitechat-secret.integration.mjs
      - name: Fresh function-shadow variant
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PREVIOUS_SECRET: ci-frc26-old-secret-0123456789abcdef
        run: node scripts/frc26-function-shadow-rechallenge.mjs
      - run: npm run typecheck
