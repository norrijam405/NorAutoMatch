name: NorAutoMatch R2 BRC-FRC-23 Current-Only Binding Issuance CI
on:
  push:
    branches:
      - "remediation/r2-frc23-current-only-binding-issuance"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frc23:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_frc23
          sudo -u postgres createdb -O norauto norauto_frc23
      - name: Prepare prerequisite
        env:
          PGPASSWORD: norauto-ci-password
        run: psql -h 127.0.0.1 -U norauto -d norauto_frc23 -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
      - name: Bootstrap old secret
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc23
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc23-old
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc23-old-secret-0123456789abcdef
        run: npm start
      - name: Rotate to current secret
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc23
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc23-new
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc23-new-secret-abcdef0123456789
          NORAUTO_PUBLIC_ABUSE_HMAC_PREVIOUS_SECRET: ci-frc23-old-secret-0123456789abcdef
        run: npm start
      - name: Previous secret must not mint new binding
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc23
          NORAUTO_PREVIOUS_SECRET: ci-frc23-old-secret-0123456789abcdef
        run: node scripts/frc23-previous-binding-secret.integration.mjs
      - name: Current secret still permits legitimate issuance
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_frc23
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc23-new-secret-abcdef0123456789
        run: node scripts/customer-opportunity-binding.frc16.integration.mjs
      - run: npm run typecheck
      - run: npm run build
