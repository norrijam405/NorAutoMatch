name: NorAutoMatch Desk Document Readiness CI

on:
  push:
    branches:
      - "feature/2026-10-04-desk-document-readiness-r0"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  desk-document-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Compile readiness verification surface
        run: |
          rm -rf .tmp-desk-document-readiness
          npx tsc -p tsconfig.desk-document-readiness.json
      - name: Challenge document readiness truth boundary
        run: node .tmp-desk-document-readiness/scripts/crm-document-readiness.behavior.js
      - name: Clean generated verification output
        run: rm -rf .tmp-desk-document-readiness
      - name: Typecheck application
        run: npm run typecheck
      - name: Production build
        run: npm run build
