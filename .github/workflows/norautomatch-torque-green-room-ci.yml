name: NorAutoMatch Torque Green Room CI

on:
  push:
    branches:
      - "candidate/**"
      - "reactivation/**"
  pull_request:
    branches:
      - main
      - "reactivation/**"

permissions:
  contents: read

jobs:
  torque-green-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile Torque Green Room verification surface
        run: |
          rm -rf .tmp-torque-green-room-tests
          npx tsc -p tsconfig.torque-green-room-tests.json

      - name: Execute Torque synthetic challenge slice
        run: node .tmp-torque-green-room-tests/scripts/torque-green-room.behavior.js

      - name: Clean generated verification output
        run: rm -rf .tmp-torque-green-room-tests

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
