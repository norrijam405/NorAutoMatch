name: NorAutoMatch R2 Five-Lane Destroyer Round 7

on:
  push:
    branches: ["evidence/r2-5lane-destroyer-round7-20261010"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroyer:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify frozen product
        run: |
          test "$(git rev-parse 248aefe6d9cf6622ed08bc93ee82b3a2812aff21^{tree})" = "ddb0838af4fac92772a1c1c74c5095fd115e3245"
          git merge-base --is-ancestor 248aefe6d9cf6622ed08bc93ee82b3a2812aff21 HEAD

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Start PostgreSQL and isolated databases
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          for db in norauto_r7d1 norauto_r7d2 norauto_r7d3 norauto_r7d4 norauto_r7d5; do
            sudo -u postgres dropdb --if-exists "$db"
            sudo -u postgres createdb -O norauto "$db"
            PGPASSWORD=norauto-ci-password psql -h 127.0.0.1 -U norauto -d "$db" -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          done

      - name: D1 preseed r2 must not suppress assignment-event immutability
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r7d1
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-assignment-events-immutable-r2.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round7-d1-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round7-d1
          PGPASSWORD: norauto-ci-password
        run: |
          node scripts/frc28-preseed-v16.mjs
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_r7d1 -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round7-d1-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round7-d1','NORAUTO_SITE_CHAT','round7-d1-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_r7d1 -v ON_ERROR_STOP=1 -c "update public.crm_conversation_assignment_events set actor_subject_id='attacker' where workspace_id='round7-d1'"; then
            echo "NEW_FINDING_D1_PRESEEDED_R2_SUPPRESSES_ASSIGNMENT_EVENT_IMMUTABILITY"
            exit 1
          fi

      - name: D2 preseed r3 must not suppress assignment-event authenticity
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r7d2
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-assignment-events-authenticity-r3.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round7-d2-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round7-d2
          PGPASSWORD: norauto-ci-password
        run: |
          node scripts/frc28-preseed-v16.mjs
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_r7d2 -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round7-d2','NORAUTO_SITE_CHAT','nonexistent-conversation','CLAIMED','attacker','victim');
          SQL
          then
            echo "NEW_FINDING_D2_PRESEEDED_R3_SUPPRESSES_ASSIGNMENT_EVENT_AUTHENTICITY"
            exit 1
          fi

      - name: D3 post-migration r2 trigger tamper must fail closed
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r7d3
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round7-d3-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round7-d3
          PGPASSWORD: norauto-ci-password
        run: |
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_r7d3 -v ON_ERROR_STOP=1 <<'SQL'
          drop trigger crm_conversation_assignment_events_immutable on public.crm_conversation_assignment_events;
          drop trigger crm_conversation_assignment_events_no_truncate on public.crm_conversation_assignment_events;
          SQL
          if npm start; then
            psql -h 127.0.0.1 -U norauto -d norauto_r7d3 -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round7-d3-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round7-d3','NORAUTO_SITE_CHAT','round7-d3-conversation','CLAIMED','rep-a','rep-a');
          commit;
          update public.crm_conversation_assignment_events set actor_subject_id='attacker' where workspace_id='round7-d3';
          SQL
            echo "NEW_FINDING_D3_RECORDED_R2_DOES_NOT_DETECT_TRIGGER_TAMPER"
            exit 1
          fi

      - name: D4 post-migration r3 trigger tamper must fail closed
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r7d4
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round7-d4-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round7-d4
          PGPASSWORD: norauto-ci-password
        run: |
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_r7d4 -v ON_ERROR_STOP=1 -c "drop trigger crm_conversation_assignment_events_insert_authenticity on public.crm_conversation_assignment_events"
          if npm start; then
            if psql -h 127.0.0.1 -U norauto -d norauto_r7d4 -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round7-d4','NORAUTO_SITE_CHAT','nonexistent-conversation','CLAIMED','attacker','attacker');
          SQL
            then
              echo "NEW_FINDING_D4_RECORDED_R3_DOES_NOT_DETECT_TRIGGER_TAMPER"
              exit 1
            fi
          fi

      - name: D5 governed secret must not mint orphan assignment evidence
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r7d5
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round7-d5-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round7-d5
          PGPASSWORD: norauto-ci-password
        run: |
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_r7d5 -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round7-d5-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round7-d5','NORAUTO_SITE_CHAT','nonexistent-conversation','CLAIMED','rep-orphan','rep-orphan');
          commit;
          SQL
          then
            echo "NEW_FINDING_D5_GOVERNED_SECRET_CAN_MINT_ORPHAN_ASSIGNMENT_EVIDENCE"
            exit 1
          fi

      - name: Typecheck
        if: always()
        run: npm run typecheck
