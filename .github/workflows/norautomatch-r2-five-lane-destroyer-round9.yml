name: NorAutoMatch R2 Five-Lane Destroyer Round 9

on:
  push:
    branches: ["evidence/r2-5lane-destroyer-round9-20261010"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroyer:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify frozen FRC-38 through FRC-44 product
        run: |
          test "$(git rev-parse 0cb0c9049f7f60b0c84a4f472c48435fb1d2deda^{tree})" = "ad33af4f9911e0434abfa9457bdf033a5b9b6dfd"
          git merge-base --is-ancestor 0cb0c9049f7f60b0c84a4f472c48435fb1d2deda HEAD

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - name: Start PostgreSQL and isolated lane databases
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          for db in norauto_r9d1 norauto_r9d2 norauto_r9d3 norauto_r9d4 norauto_r9d5; do
            sudo -u postgres dropdb --if-exists "$db"
            sudo -u postgres createdb -O norauto "$db"
            PGPASSWORD=norauto-ci-password psql -h 127.0.0.1 -U norauto -d "$db" -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          done

      - name: D1 preseed upstream-existence r2
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r9d1
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-ownership-upstream-existence-r2.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round9-d1-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round9-d1
          PGPASSWORD: norauto-ci-password
        run: |
          node scripts/frc28-preseed-v16.mjs
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_r9d1 -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round9-d1-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('round9-d1','NORAUTO_SITE_CHAT','nonexistent','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL
          then
            echo "NEW_FINDING_D1_PRESEEDED_UPSTREAM_EXISTENCE_R2_SUPPRESSES_ASSIGNMENT_TRUTH"
            exit 1
          fi
          echo "PASS D1 Round9: preseeded upstream-existence migration did not suppress truth binding"

      - name: D2 preseed sequencing r5
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r9d2
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-assignment-events-sequencing-r5.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round9-d2-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round9-d2
          PGPASSWORD: norauto-ci-password
        run: |
          node scripts/frc28-preseed-v16.mjs
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_r9d2 -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.crm_conversation_events
            (workspace_id,provider,event_id,conversation_id,event_type,observed_at,normalized_payload,routing_decision,routing_reasons,processing_state)
          values ('round9-d2','NORAUTO_SITE_CHAT','round9-d2-event','round9-d2-conversation',
            'CONVERSATION_ENDED_OR_HANDOFF_READY',clock_timestamp(),'{}'::jsonb,'CONTACTABLE','[]'::jsonb,'RECEIVED');
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round9-d2-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('round9-d2','NORAUTO_SITE_CHAT','round9-d2-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round9-d2','NORAUTO_SITE_CHAT','round9-d2-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_r9d2 -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round9-d2-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round9-d2','NORAUTO_SITE_CHAT','round9-d2-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          then
            echo "NEW_FINDING_D2_PRESEEDED_R5_REOPENS_DUPLICATE_CLAIM"
            exit 1
          fi
          echo "PASS D2 Round9: r6 safely subsumes preseeded r5 sequencing"

      - name: D3 preseed concurrency r6
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r9d3
          NORAUTO_PRESEED_MIGRATION: infrastructure/norautomatch-conversation-assignment-events-concurrency-r6.sql
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round9-d3-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round9-d3
        run: |
          node scripts/frc28-preseed-v16.mjs
          npm start
          node scripts/round9-d3-concurrency-preseed.mjs

      - name: D4 downgrade assignment mutation guard to auth-only
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r9d4
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round9-d4-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round9-d4
          PGPASSWORD: norauto-ci-password
        run: |
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_r9d4 -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.norautomatch_enforce_conversation_assignment_mutation_authenticity()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          declare
            candidate_secret text;
          begin
            candidate_secret := current_setting('norautomatch.conversation_assignment_hmac_secret',true);
            if not public.norautomatch_conversation_assignment_secret_trusted(candidate_secret) then
              raise exception 'CONVERSATION_ASSIGNMENT_AUTHENTICITY_REQUIRED';
            end if;
            if tg_op='DELETE' then return old; end if;
            return new;
          end;
          $$;
          SQL
          npm start
          if psql -h 127.0.0.1 -U norauto -d norauto_r9d4 -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round9-d4-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('round9-d4','NORAUTO_SITE_CHAT','nonexistent','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          commit;
          SQL
          then
            echo "NEW_FINDING_D4_AUTH_ONLY_DOWNGRADE_REMOVES_UPSTREAM_EXISTENCE_WITHOUT_STARTUP_DETECTION"
            exit 1
          fi
          echo "PASS D4 Round9: upstream-existence downgrade detected"

      - name: D5 downgrade evolving event guard to state-only marker spoof
        continue-on-error: true
        env:
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_r9d5
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-round9-d5-secret-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: round9-d5
          PGPASSWORD: norauto-ci-password
        run: |
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_r9d5 -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.norautomatch_enforce_assignment_event_insert_authenticity()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          begin
            perform 'norautomatch.conversation_assignment_hmac_secret public.norautomatch_conversation_assignment_secret_trusted CONVERSATION_ASSIGNMENT_EVENT_AUTHENTICITY_REQUIRED CONVERSATION_ASSIGNMENT_EVENT_CLAIM_TRUTH_INVALID CONVERSATION_ASSIGNMENT_EVENT_RELEASE_TRUTH_INVALID public.crm_conversation_assignments CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED current_state current_assignee';
            return new;
          end;
          $$;
          SQL
          npm start
          psql -h 127.0.0.1 -U norauto -d norauto_r9d5 -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.crm_conversation_events
            (workspace_id,provider,event_id,conversation_id,event_type,observed_at,normalized_payload,routing_decision,routing_reasons,processing_state)
          values ('round9-d5','NORAUTO_SITE_CHAT','round9-d5-event','round9-d5-conversation',
            'CONVERSATION_ENDED_OR_HANDOFF_READY',clock_timestamp(),'{}'::jsonb,'CONTACTABLE','[]'::jsonb,'RECEIVED');
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round9-d5-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignments
            (workspace_id,provider,conversation_id,assignee_subject_id,assignment_state,assigned_at,updated_at)
          values ('round9-d5','NORAUTO_SITE_CHAT','round9-d5-conversation','rep-a','ASSIGNED',clock_timestamp(),clock_timestamp());
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round9-d5','NORAUTO_SITE_CHAT','round9-d5-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          if psql -h 127.0.0.1 -U norauto -d norauto_r9d5 -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-round9-d5-secret-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('round9-d5','NORAUTO_SITE_CHAT','round9-d5-conversation','CLAIMED','rep-a','rep-a');
          commit;
          SQL
          then
            echo "NEW_FINDING_D5_STATE_ONLY_DOWNGRADE_REMOVES_SEQUENCING_WITHOUT_STARTUP_DETECTION"
            exit 1
          fi
          echo "PASS D5 Round9: sequencing downgrade detected"

      - name: Typecheck
        if: always()
        run: npm run typecheck
