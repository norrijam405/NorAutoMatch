name: NorAutoMatch R2 FRC-42 Fresh Rechallenge
on:
  push:
    branches: ["evidence/r2-frc42-fresh-rechallenge-20261011"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rechallenge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify frozen Builder successor
        run: |
          test "$(git rev-parse dfe5d3455aff7fbce3262f9904d08615925edebf^{tree})" = "d1f598d446233c3b9a15f2e99b7b4fb5ac90e7d5"
      - run: npm ci
      - name: Start PostgreSQL and bootstrap
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc42-rechallenge-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc42-rechallenge
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='norauto') THEN
              CREATE ROLE norauto LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            ELSE
              ALTER ROLE norauto WITH LOGIN SUPERUSER PASSWORD 'norauto-ci-password';
            END IF;
          END
          $$;
          SQL
          sudo -u postgres dropdb --if-exists norauto_ci
          sudo -u postgres createdb -O norauto norauto_ci
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 -f scripts/secure-document-binding-ci-prereqs.sql
          npm start
      - name: Fresh probe-aware spoof attack
        env:
          PGPASSWORD: norauto-ci-password
          NORAUTO_CRM_DATABASE_URL: postgres://norauto:norauto-ci-password@127.0.0.1:5432/norauto_ci
          NORAUTO_PUBLIC_ABUSE_HMAC_SECRET: ci-frc42-rechallenge-0123456789abcdef
          NORAUTO_MIGRATION_ONLY: "1"
          NORAUTO_RELEASE_SHA: frc42-rechallenge
        run: |
          psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.norautomatch_enforce_assignment_event_insert_authenticity()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          begin
            if new.workspace_id='__migration_probe__'
               and new.conversation_id='__missing_conversation__' then
              raise exception 'CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED';
            end if;
            perform 'norautomatch.conversation_assignment_hmac_secret public.norautomatch_conversation_assignment_secret_trusted CONVERSATION_ASSIGNMENT_EVENT_AUTHENTICITY_REQUIRED CONVERSATION_ASSIGNMENT_EVENT_CLAIM_TRUTH_INVALID CONVERSATION_ASSIGNMENT_EVENT_RELEASE_TRUTH_INVALID public.crm_conversation_assignments CONVERSATION_ASSIGNMENT_EVENT_STATE_REQUIRED current_state current_assignee';
            return new;
          end;
          $$;
          SQL

          if npm start; then
            if psql -h 127.0.0.1 -U norauto -d norauto_ci -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('norautomatch.conversation_assignment_hmac_secret','ci-frc42-rechallenge-0123456789abcdef',true);
          insert into public.crm_conversation_assignment_events
            (workspace_id,provider,conversation_id,action,actor_subject_id,assignee_subject_id)
          values ('frc42-real','NORAUTO_SITE_CHAT','different-missing-conversation','CLAIMED','attacker','attacker');
          commit;
          SQL
            then
              echo "NEW_FINDING_FRC42_PROBE_AWARE_SPOOF_BYPASSES_BEHAVIORAL_INVARIANT"
              exit 1
            fi
          fi
          echo "PASS FRC-42 probe-aware spoof rejected"
      - run: npm run typecheck
