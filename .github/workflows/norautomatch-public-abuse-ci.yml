name: NorAutoMatch Public Abuse Control CI

on:
  push:
    branches:
      - "reactivation/**"
  pull_request:
    branches:
      - main
      - "reactivation/**"

permissions:
  contents: read

jobs:
  public-abuse-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile verification surface
        run: |
          rm -rf .tmp-inventory-tests
          npx tsc -p tsconfig.inventory-tests.json

      - name: Challenge abuse-control policy and false bypasses
        run: node .tmp-inventory-tests/scripts/public-abuse-control.behavior.js

      - name: Enforce distributed persistence and privacy contract
        run: |
          grep -q 'PostgresPublicAbuseCounterStore' src/app/api/leads/route.ts
          grep -q 'NORAUTO_PUBLIC_ABUSE_HMAC_SECRET' src/app/api/leads/route.ts
          grep -q 'evaluatePublicAbuse' src/app/api/leads/route.ts
          grep -q 'ON CONFLICT (bucket_key, subject_hash) DO UPDATE' src/lib/public-abuse-postgres.ts
          grep -q 'public_abuse_buckets' infrastructure/norautomatch-crm-v6-public-abuse-control.sql
          grep -q 'subject_hash CHAR(64)' infrastructure/norautomatch-crm-v6-public-abuse-control.sql
          ! grep -q 'const requests = new Map' src/app/api/leads/route.ts
          ! grep -q 'raw_ip' infrastructure/norautomatch-crm-v6-public-abuse-control.sql
          ! grep -q 'ip_address' infrastructure/norautomatch-crm-v6-public-abuse-control.sql

      - name: Clean generated verification output
        run: rm -rf .tmp-inventory-tests

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
