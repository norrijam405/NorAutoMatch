name: NorAutoMatch Cost Receipt CI

on:
  push:
    branches:
      - "candidate/**"
      - "reactivation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cost-receipt-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Compile Cost Receipt verification surface
        run: |
          rm -rf .tmp-cost-receipt-tests
          npx tsc -p tsconfig.cost-receipt-tests.json

      - name: Challenge cost truth and integrity boundaries
        run: node .tmp-cost-receipt-tests/scripts/cost-receipt.behavior.js

      - name: Clean generated verification output
        run: rm -rf .tmp-cost-receipt-tests

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
